<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bible Blood Bowl</title>
<meta name="theme-color" content="#0e1712">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blood Bowl">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#0e1712; --surface:#16231b; --surface2:#1d2e24; --line:#2a3d31;
  --text:#f1ebdd; --muted:#9fae9f; --accent:#d4232f; --gold:#e0b04f;
  --cA:#4f9bdc; --cF:#e0524a; --cG:#b9b2a3; --cM:#a77be0; --cP:#e0b04f; --cS:#5fbf7a; --cT:#3fc0b8;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:calc(72px + var(--safe-b))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* Header */
header{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 85%,rgba(14,23,18,0));padding:calc(var(--safe-t) + 10px) 16px 10px}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.brand h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;font-stretch:condensed}
.brand h1 span{color:var(--accent)}
.brand small{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.search{position:relative}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:17px;padding:0 40px 0 40px;outline:none;-webkit-appearance:none}
.search input:focus{border-color:var(--gold)}
.search svg{position:absolute;left:12px;top:12px;width:20px;height:20px;stroke:var(--muted)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search .clear{position:absolute;right:6px;top:6px;width:32px;height:32px;border-radius:16px;color:var(--muted);font-size:20px;display:none}
.search.has .clear{display:block}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:10px 16px 2px;scrollbar-width:none}
.chips.off{display:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 13px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.chip i{width:8px;height:8px;border-radius:4px;display:inline-block}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}

/* Lists */
main{padding:0 16px}
.view{display:none}.view.on{display:block}
.letter{position:sticky;top:var(--hh,150px);font-size:12px;font-weight:800;color:var(--gold);padding:10px 2px 4px;letter-spacing:.1em;background:var(--bg);z-index:5}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;background:var(--surface);border-radius:12px;margin-bottom:6px;border:1px solid transparent}
.item:active{background:var(--surface2)}
.dot{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:900;font-size:14px;color:#0e1712}
.dot.emo{background:var(--surface2);font-size:20px;line-height:1}
.sheet .head .dot.emo{font-size:23px}
.item .main{flex:1;min-width:0}
.item .name{display:block;font-weight:650;font-size:16px;line-height:1.25}
.item .sub{display:block;margin-top:2px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:4px;flex:none}
.tag{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.tag.ob{color:#fff;background:var(--accent)}.tag.el{color:var(--gold)}
.star{color:var(--gold);font-size:14px}
h2.group{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:18px 2px 8px;font-weight:800}
.count{color:var(--muted);font-size:13px;margin:4px 2px 8px}
.empty{color:var(--muted);text-align:center;padding:40px 20px}

/* Tables */
.card{background:var(--surface);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.card h3 .dice{font-size:12px;font-weight:800;background:var(--accent);color:#fff;padding:3px 8px;border-radius:7px}
.row{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .r{font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
.row b{display:block;font-size:15px}
.row span{font-size:14px;color:#d6d0c2}
.card.pass .m{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.card.pass .m b{flex:none;max-width:52%}.card.pass .m span{text-align:right;color:#d6d0c2}
.pleg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.pz{display:flex;align-items:center;gap:7px;background:var(--surface2);border-radius:9px;padding:7px 9px;font-size:14px}
.pz i{width:14px;height:14px;border-radius:4px;flex:none}.pz b{flex:1;font-weight:650}.pz span{font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.pchart{display:block;width:100%;max-width:360px;margin:0 auto 6px}
.pchart .ax{fill:var(--muted);font-size:9.5px;font-weight:700;font-family:inherit}
.pnote{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.sub3{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:800;margin:12px 0 2px}
.mods .m{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.mods .m:first-of-type{border-top:0}
.mods .m b{flex:none}
.mods .m span{text-align:right;color:#d6d0c2}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;background:var(--surface);border-radius:20px 20px 0 0;z-index:50;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-bottom:var(--safe-b)}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 4px}
.sheet .head{display:flex;align-items:flex-start;gap:12px;padding:10px 18px 12px;border-bottom:1px solid var(--line)}
.sheet .head .dot{width:40px;height:40px;font-size:16px}
.sheet .head h2{margin:0;font-size:22px;line-height:1.2}
.sheet .head .meta{font-size:13px;color:var(--muted);margin-top:3px}
.sheet.tall{height:92vh;max-height:92vh}
.sheet .ttl{flex:1;min-width:0}
.hb{flex:none;width:36px;height:36px;border-radius:18px;background:var(--surface2);color:var(--muted);font-size:22px;line-height:1}
.hb.back{display:none;font-size:28px;margin-right:-4px}.hb.back.on{display:block}
.tinfo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tinfo div{background:var(--surface2);border-radius:10px;padding:10px 12px}
.tinfo small,.lbl{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tinfo b{display:block;font-size:17px}.tinfo span{font-size:12px;color:var(--muted)}
.body p.lbl{margin:14px 0 6px}
.pl{background:var(--surface2);border-radius:12px;padding:12px;margin-bottom:10px}
.plh{display:flex;align-items:baseline;gap:8px}
.plh .q{font-size:12px;font-weight:800;color:var(--bg);background:var(--gold);border-radius:6px;padding:1px 6px;flex:none}
.plh .pn{font-weight:700;flex:1}
.plh .pc{font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;flex:none}
.kw{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.st{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:8px}
.st div{background:var(--bg);border-radius:8px;text-align:center;padding:4px 0;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.st small{display:block;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.05em}
.sks{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.sk{font-size:13.5px;padding:4px 9px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--text);text-decoration:none}
.sk.off{color:var(--muted)}
.none{color:var(--muted);font-size:14px}
.acc{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:#d6d0c2}
.acc b{color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;margin-right:3px}
.sheet .body{overflow-y:auto;padding:14px 18px 24px;font-size:16.5px;-webkit-overflow-scrolling:touch}
.body p{margin:0 0 12px}
.body ul,.body ol{margin:0 0 12px;padding-left:20px}
.body li{margin-bottom:6px}
.body .t{width:100%;border-collapse:collapse;margin:4px 0 14px;font-size:15px}
.body .t td,.body .t th{border-top:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.body .t th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;border-top:0}
.body .formula{background:var(--surface2);border-left:3px solid var(--gold);padding:10px 12px;border-radius:8px;font-weight:600}
.body .note{color:var(--muted);font-size:14.5px}
.body ol.steps{counter-reset:s;list-style:none;padding:0}
.body ol.steps li{counter-increment:s;position:relative;padding-left:34px;min-height:26px}
.body ol.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:12px;background:var(--accent);color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center}
.body a.x{color:var(--gold);text-decoration:none;border-bottom:1px dotted var(--gold)}
.src{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
mark{background:rgba(224,176,79,.3);color:inherit;border-radius:3px}

/* Tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(22,35,27,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav button{flex:1;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted);font-weight:600}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8}
nav button.on{color:var(--gold)}

/* Chrono de match */
body.has-pill{padding-bottom:calc(140px + var(--safe-b))}
.pill{position:fixed;left:10px;right:10px;bottom:calc(60px + var(--safe-b) + 8px);z-index:32;display:none;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-left:5px solid var(--tc);border-radius:16px;padding:6px 6px 6px 12px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.pill.on{display:flex}
.pill #pOpen{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column}
.pill #pName{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill #pTime{font-size:24px;font-weight:850;font-variant-numeric:tabular-nums;line-height:1.1}
.pill #pPause{width:44px;height:44px;border-radius:12px;background:var(--surface);font-size:18px}
.pill #pEnd{height:44px;padding:0 14px;border-radius:12px;background:var(--text);color:var(--bg);font-weight:800;font-size:15px}
.pill.warn #pTime{color:var(--gold)}
.pill.over{border-color:var(--accent);animation:tmPulse 1s infinite}
.pill.over #pTime{color:var(--accent)}
.pill.paused #pTime{opacity:.5}
@keyframes tmPulse{50%{background:#3a1a1c}}
.stimer{display:none;align-self:center;align-items:center;gap:6px;margin:4px auto 0;font-size:13px;color:var(--muted);background:var(--surface2);border-radius:12px;padding:3px 10px;font-variant-numeric:tabular-nums}
.stimer.on{display:flex}
.stimer i{width:8px;height:8px;border-radius:4px;background:var(--tc)}
.stimer b{color:var(--text)}.stimer.warn b{color:var(--gold)}.stimer.over b{color:var(--accent)}
.tm-card{display:flex;flex-direction:column;gap:12px}
.tm-seg{display:flex;background:var(--bg);border-radius:11px;padding:3px;gap:3px}
.tm-seg button{flex:1;height:36px;border-radius:9px;font-size:14px;font-weight:650;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.tm-seg button.on{background:var(--surface2);color:var(--text)}
.tm-step{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tm-step b{display:block;font-size:15px}.tm-step small{display:block;font-size:12.5px;color:var(--muted)}
.tm-ctl{display:flex;align-items:center;gap:4px;flex:none}
.tm-ctl button{width:40px;height:40px;border-radius:12px;background:var(--surface2);font-size:22px;font-weight:600}
.tm-ctl output{min-width:64px;text-align:center;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.tm-res{background:var(--surface2);border-left:3px solid var(--gold);border-radius:8px;padding:10px 12px;font-size:14px}
.tm-res b{color:var(--gold)}
.tm-tog{display:flex;align-items:center;gap:12px;text-align:left}
.tm-tog span{flex:1}.tm-tog b{display:block;font-size:15px}.tm-tog small{display:block;font-size:12.5px;color:var(--muted)}
.tm-tog i{flex:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:background .2s}
.tm-tog i:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:transform .2s}
.tm-tog.on i{background:var(--cS)}.tm-tog.on i:after{transform:translateX(20px)}
.tm-name{display:flex;align-items:center;gap:10px}
.tm-name i{width:12px;height:12px;border-radius:6px;flex:none}
.tm-name input{flex:1;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;padding:0 12px;outline:none}
.tm-name input:focus{border-color:var(--gold)}
.tm-big{display:block;width:100%;height:58px;border-radius:14px;background:var(--accent);color:#fff;font-size:19px;font-weight:850;margin:4px 0 10px;letter-spacing:.02em}
.tm-big:active{opacity:.8}
.tm-main{background:var(--surface);border-radius:18px;border-top:6px solid var(--tc);padding:16px;text-align:center;margin-bottom:12px}
.tm-who{display:flex;justify-content:center;align-items:center;gap:8px;font-weight:750;font-size:18px}
.tm-who i{width:12px;height:12px;border-radius:6px;background:var(--tc)}
.tm-p{font-size:11px;font-weight:800;background:var(--gold);color:var(--bg);border-radius:6px;padding:2px 6px;letter-spacing:.06em}
.tm-time{font-size:76px;font-weight:850;font-variant-numeric:tabular-nums;line-height:1.05;margin:6px 0 10px;letter-spacing:-.02em}
.tm-main.warn .tm-time{color:var(--gold)}
.tm-main.over{animation:tmPulse 1s infinite}.tm-main.over .tm-time{color:var(--accent)}
.tm-bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.tm-bar i{display:block;height:100%;background:var(--tc);transition:width .25s linear}
.tm-info{font-size:13px;color:var(--muted);margin-top:8px;min-height:18px}
.tm-row{display:flex;gap:8px;margin-bottom:12px}
.tm-row button{flex:1;height:46px;border-radius:12px;background:var(--surface);font-weight:650;font-size:15px}
.tm-row button:disabled{opacity:.35}
.tm-score{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tm-score>div{background:var(--surface);border-radius:12px;padding:10px 12px;border-top:3px solid;display:flex;flex-direction:column;gap:3px}
.tm-score b{display:flex;align-items:center;gap:6px;font-size:15px;margin-bottom:2px;overflow:hidden;white-space:nowrap}
.tm-score b i{width:8px;height:8px;border-radius:4px;flex:none}
.tm-score span{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.tm-score em{font-style:normal;font-weight:750;color:var(--text);font-variant-numeric:tabular-nums}
.tm-score em.red{color:var(--accent)}
.tm-row button.tm-stop{color:#ff6b73;border:1px solid rgba(212,35,47,.45)}
#v-match{padding-bottom:24px}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Blood <span>Bowl</span></h1><small>3e Saison · aide-mémoire</small></div>
  <div class="search" id="searchBox">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Compétence, règle, tableau…" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="clear" id="clear" aria-label="Effacer">×</button>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main>
  <section class="view on" id="v-skills"></section>
  <section class="view" id="v-rules"></section>
  <section class="view" id="v-tables"></section>
  <section class="view" id="v-teams"></section>
  <section class="view" id="v-match"></section>
  <section class="view" id="v-search"></section>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="stimer" id="sTimer"></div>
  <div class="head"><button class="hb back" id="sBack" aria-label="Retour">‹</button><div class="dot" id="sDot"></div><div class="ttl"><h2 id="sTitle"></h2><div class="meta" id="sMeta"></div></div><button class="hb" id="sClose" aria-label="Fermer">×</button></div>
  <div class="body" id="sBody"></div>
</div>

<div class="pill" id="pill">
  <button id="pOpen" aria-label="Ouvrir le chrono"><span id="pName"></span><span id="pTime"></span></button>
  <button id="pPause" aria-label="Pause">⏸</button>
  <button id="pEnd">Fin du tour</button>
</div>

<nav>
  <button data-tab="skills" class="on"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>Compétences</button>
  <button data-tab="rules"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg>Règles</button>
  <button data-tab="tables"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.3"/><circle cx="15" cy="15" r="1.3"/><circle cx="15" cy="9" r="1.3"/><circle cx="9" cy="15" r="1.3"/></svg>Tableaux</button>
  <button data-tab="teams"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8.5-7 10-4-1.5-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>Équipes</button>
  <button data-tab="match"><svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2M10 3h4M12 3v3M18.5 6.5l1.5-1.5"/></svg>Match</button>
</nav>

<script src="data-skills.js?v=15"></script>
<script src="data-rules.js?v=15"></script>
<script src="data-teams.js?v=15"></script>
<script src="app.js?v=15"></script>
<script src="timer.js?v=15"></script>
</body>
</html>
